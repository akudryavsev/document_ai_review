# Рабочий пример прогона. Документы и вопросы лежат в ./experiments/ (каталог в .gitignore).
# Имена в embedding.models, reranker.models и answer.models — файлы в models/, с суффиксом .gguf.
# Команда run до любой фазы проверяет, что каждый файл из трёх списков есть в models/.
# Для этого примера нужны models/embed.gguf, models/rerank.gguf и models/answer.gguf.
# Фаза A1 считает эмбеддинги кусков файлом из embedding.models, поэтому без него она не стартует.
#
# Список фаз задаёт --phase. Без флага выполняются A1,A2,B.
# Поля phases.run_a1, run_a2 и run_b команда не читает.
# experiments/questions.json читается, когда в --phase есть A2 или B.
#
# Из контейнера app:
#   python main.py run --config config.yaml
#   python main.py run --config config.yaml --phase A1 --force-phase A1

input:
  documents_dir: "./experiments/documents"
  questions_file: "./experiments/questions.json"

extraction:
  pdf_text_layer_required: true
  debug_dump: true

chunking:
  max_tokens: 800
  overlap_tokens: 100
  min_chunk_tokens: 100
  preserve_section_path: true

inference:
  base_url: "http://inference:8080"
  request_timeout_sec: 120
  poll_interval_sec: 0.5

embedding:
  models:
    - embed.gguf
  batch_size: 8
  dtype: "fp16"
  device: "cuda:0"
  persist_chunk_index: true
  persist_bm25: false

retrieval:
  top_k: 20
  # 0 — не резать по fused_score, только top_k. Поднять, когда шкала модели замерена.
  score_threshold: 0
  query_strategy: "max_over_variants"
  hybrid:
    enabled: true
    bm25_weight: 0.3
    vector_weight: 0.7
  persist_candidates: true

reranker:
  enabled: true
  models:
    - rerank.gguf
  top_n: 5
  # 0 — в сборку всегда top_n лучших. Поднять для отсечения слабых скоров.
  score_threshold: 0
  device: "cuda:0"

verification:
  enabled: true
  model: "small-llm"
  batch_size: 8
  device: "auto"

context:
  expansion: "section"
  neighbors_fallback: 2
  max_total_tokens: 6000
  max_section_tokens: 3000
  # 0 — ранний выход выключен. Поднять: max rerank < порога → empty_search=true
  early_exit_threshold: 0
  compression: none

answer:
  models:
    - answer.gguf
  device: "auto"
  temperature: 0
  max_output_tokens: 800
  require_citations: true

phases:
  # Флаги run_* прогон не читает. Фазы задаёт --phase.
  run_a1: true
  run_a2: true
  run_b: true
  contexts_dir: "./experiments/contexts"
  index_dir: "./experiments/index"
  skip_if_artifacts_valid: true

runtime:
  retries: 2
  retry_pause_sec: 0
  question_parallelism: 1
  results_dir: "./experiments/results"
  log_level: "INFO"
  # Корень чанков, эмбеддингов вопросов, embed_cache, meta ответов и debug.
  # Куски документа: experiments/emb/<файл эмбеддера>/<имя документа>/
  cache_dir: "./experiments"
