# Имена секций совпадают с полями конфига приложения.
# GGUF лежат в каталоге models на хосте и в репозиторий не входят.

[*]
ctx-size = 4096

[embed]
model = /models/embed.gguf
embedding = true

[rerank]
model = /models/rerank.gguf
embedding = true
reranking = true
pooling = rank

[answer]
model = /models/answer.gguf
